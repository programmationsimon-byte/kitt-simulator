<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KITT 3000 - Simulateur 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(15, 15, 20, 0.84);
      --line: #00ffcc;
      --line-soft: rgba(0, 255, 204, 0.28);
      --danger: #ff3b3b;
      --danger-soft: rgba(255, 59, 59, 0.2);
      --text: #e6fff9;
      --muted: #a8b8b3;
      --shadow: rgba(0, 255, 204, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(0,255,204,0.08), transparent 35%),
        linear-gradient(180deg, #080b0d 0%, #050505 100%);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .auth-box {
      width: min(90vw, 420px);
      background: rgba(17, 17, 20, 0.95);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 30px 28px 24px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.28), inset 0 0 20px rgba(0, 255, 204, 0.06);
    }

    .auth-box h2 {
      margin: 0 0 10px;
      color: var(--line);
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 1.4rem;
    }

    .auth-box p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .auth-box input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(10, 10, 12, 0.9);
      color: white;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
      letter-spacing: .18em;
    }

    .auth-box button {
      margin-top: 18px;
      padding: 12px 26px;
      background: var(--line);
      color: #000;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .auth-box button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 18px rgba(255,255,255,0.6);
      background: #ffffff;
    }

    #simulator-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #webgl-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .camera-controls {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 20;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .camera-controls button,
    .ipad-menu button {
      background: rgba(12, 22, 22, 0.8);
      color: var(--line);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .camera-controls button:hover,
    .ipad-menu button:hover {
      background: var(--line);
      color: #000;
      transform: translateY(-1px);
    }

    #ipad-dashboard {
      position: absolute;
      right: 22px;
      bottom: 22px;
      width: min(320px, calc(100vw - 24px));
      background: rgba(10, 10, 15, 0.86);
      border: 2px solid var(--danger);
      border-radius: 18px;
      padding: 14px 14px 12px;
      box-shadow: 0 0 20px rgba(255, 59, 59, 0.22), inset 0 0 15px rgba(255, 59, 59, 0.08);
      z-index: 20;
    }

    .ipad-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--line);
      letter-spacing: .05em;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 10px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--line);
      box-shadow: 0 0 10px var(--line);
      display: inline-block;
    }

    .central-module {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 16px auto 12px;
      border-radius: 50%;
      border: 3px dashed var(--danger);
      background: radial-gradient(circle at center, rgba(255, 59, 59, 0.22) 0%, rgba(0,0,0,1) 72%);
      overflow: hidden;
      box-shadow: inset 0 0 18px rgba(255, 59, 59, 0.12);
    }

    .scanner-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, transparent 0%, #ff3b3b 20%, #ffd8d8 50%, #ff3b3b 80%, transparent 100%);
      box-shadow: 0 0 12px rgba(255, 59, 59, 0.9);
      animation: scan 1.6s infinite alternate ease-in-out;
    }

    @keyframes scan {
      0% { top: 0; }
      100% { top: 98px; }
    }

    .ipad-menu {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .ipad-menu button {
      flex: 1;
      font-size: 0.75rem;
      padding: 8px 8px;
    }

    .ai-chatbox {
      background: rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 8px 8px 10px;
    }

    #chat-output {
      min-height: 42px;
      display: flex;
      align-items: center;
      font-size: 0.8rem;
      color: #ffc7c7;
      line-height: 1.4;
      font-style: italic;
      margin-bottom: 8px;
    }

    .ai-chatbox input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
    }

    @media (max-width: 680px) {
      .camera-controls {
        top: 12px;
        left: 12px;
        right: 12px;
      }

      .camera-controls button {
        flex: 1 1 32%;
        min-width: 110px;
      }

      #ipad-dashboard {
        bottom: 12px;
        right: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="auth-screen" class="overlay">
    <div class="auth-box">
      <h2>K.I.T.T. OS v3.0</h2>
      <p>Code d'accès requis (Indice : 2008)</p>
      <input type="password" id="auth-code" value="2008" placeholder="Code..." />
      <button id="auth-btn" type="button">Connexion</button>
    </div>
  </div>

  <div id="simulator-container">
    <div id="webgl-container"></div>

    <div class="camera-controls">
      <button id="cam-ext" type="button">Vue Extérieure</button>
      <button id="cam-driver" type="button">Poste de Conduite</button>
      <button id="cam-top" type="button">Vue Zénithale</button>
    </div>

    <div id="ipad-dashboard">
      <div class="ipad-header">
        <span class="status-dot"></span>
        <span>KITT AI : En ligne</span>
      </div>

      <div class="central-module">
        <div class="scanner-line"></div>
      </div>

      <div class="ipad-menu">
        <button id="btn-attack" type="button">Mode Attaque</button>
        <button id="btn-doors" type="button">Portes</button>
        <button id="btn-diag" type="button">Diagnostic</button>
      </div>

      <div class="ai-chatbox">
        <div id="chat-output">"Bonjour, je suis KITT. Prêt pour la synchronisation."</div>
        <input type="text" id="chat-input" placeholder="Parler à KITT..." />
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const authScreen = document.getElementById('auth-screen');
      const authCodeInput = document.getElementById('auth-code');
      const authBtn = document.getElementById('auth-btn');

      function executeAuth() {
        const code = authCodeInput.value.trim();
        if (code === '2008') {
          authScreen.style.display = 'none';
        } else {
          alert('Code incorrect. Indice : Année de la Mustang GT500 (2008)');
        }
      }

      authBtn.addEventListener('click', executeAuth);
      authCodeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') executeAuth();
      });

      const container = document.getElementById('webgl-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090b10);
      scene.fog = new THREE.Fog(0x090b10, 10, 35);

      const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
      dirLight.position.set(10, 18, 10);
      scene.add(dirLight);

      const rimLight = new THREE.PointLight(0x00ffcc, 1.6, 25);
      rimLight.position.set(-5, 2, 5);
      scene.add(rimLight);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(50, 50),
        new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.85, metalness: 0.25 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.02;
      scene.add(ground);

      const grid = new THREE.GridHelper(30, 30, 0x00ffcc, 0x1d1d1d);
      grid.position.y = 0.01;
      scene.add(grid);

      const carGroup = new THREE.Group();
      scene.add(carGroup);

      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: 0x101010,
        roughness: 0.28,
        metalness: 0.92,
        emissive: 0x050505
      });

      const accentMaterial = new THREE.MeshStandardMaterial({
        color: 0x00ffcc,
        emissive: 0x00ffcc,
        emissiveIntensity: 0.3,
        roughness: 0.2,
        metalness: 0.8
      });

      const redGlow = new THREE.MeshStandardMaterial({
        color: 0xff0000,
        emissive: 0xff0000,
        emissiveIntensity: 0.7,
        roughness: 0.2,
        metalness: 0.9
      });

      const body = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.7, 5.2), bodyMaterial);
      body.position.y = 0.7;
      carGroup.add(body);

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.75, 2.5), bodyMaterial);
      cabin.position.set(0, 1.2, -0.3);
      carGroup.add(cabin);

      const hood = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.24, 1.6), bodyMaterial);
      hood.position.set(0, 0.95, 1.55);
      carGroup.add(hood);

      const rear = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.24, 1.6), bodyMaterial);
      rear.position.set(0, 0.95, -1.7);
      carGroup.add(rear);

      const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 1.4), accentMaterial);
      windshield.rotation.z = Math.PI / 2;
      windshield.position.set(0, 1.35, 0.5);
      carGroup.add(windshield);

      const frontLightLeft = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 0.35), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.3 }));
      frontLightLeft.position.set(-0.85, 0.8, 2.65);
      carGroup.add(frontLightLeft);

      const frontLightRight = frontLightLeft.clone();
      frontLightRight.position.x = 0.85;
      carGroup.add(frontLightRight);

      const rearLightLeft = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 0.35), redGlow);
      rearLightLeft.position.set(-0.85, 0.8, -2.62);
      carGroup.add(rearLightLeft);

      const rearLightRight = rearLightLeft.clone();
      rearLightRight.position.x = 0.85;
      carGroup.add(rearLightRight);

      const wheelGeometry = new THREE.CylinderGeometry(0.42, 0.42, 0.42, 20);
      const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9, metalness: 0.5 });
      const wheelPositions = [
        [-1.45, 0.42, 1.6],
        [1.45, 0.42, 1.6],
        [-1.45, 0.42, -1.6],
        [1.45, 0.42, -1.6]
      ];

      const wheels = [];
      wheelPositions.forEach(([x, y, z]) => {
        const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x, y, z);
        wheels.push(wheel);
        carGroup.add(wheel);
      });

      const underGlow = new THREE.Mesh(
        new THREE.BoxGeometry(2.5, 0.05, 4.2),
        new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.9, transparent: true, opacity: 0.45 })
      );
      underGlow.position.y = 0.12;
      carGroup.add(underGlow);

      const neonStripe = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.08, 0.18), accentMaterial);
      neonStripe.position.set(0, 0.9, 2.18);
      carGroup.add(neonStripe);

      let attackModeActive = false;
      let doorOpen = false;

      function setCamera(type) {
        if (type === 'ext') {
          camera.position.set(0, 3.2, 7);
          camera.lookAt(carGroup.position.x, 0.8, 0);
        } else if (type === 'driver') {
          camera.position.set(-0.35, 1.05, 0.15);
          camera.lookAt(0, 0.85, 6.8);
        } else if (type === 'top') {
          camera.position.set(0, 11.5, 0.01);
          camera.lookAt(carGroup.position.x, 0, 0);
        }
      }

      function updateDoorAnimation() {
        const leftDoor = carGroup.getObjectByName('leftDoor');
        const rightDoor = carGroup.getObjectByName('rightDoor');

        if (!leftDoor) {
          const leftDoorGeo = new THREE.BoxGeometry(0.12, 0.75, 1.45);
          const rightDoorGeo = new THREE.BoxGeometry(0.12, 0.75, 1.45);
          const doorMaterial = new THREE.MeshStandardMaterial({ color: 0x171717, roughness: 0.35, metalness: 0.9 });

          const leftDoorMesh = new THREE.Mesh(leftDoorGeo, doorMaterial);
          leftDoorMesh.name = 'leftDoor';
          leftDoorMesh.position.set(-1.5, 0.8, 0.8);
          const rightDoorMesh = new THREE.Mesh(rightDoorGeo, doorMaterial);
          rightDoorMesh.name = 'rightDoor';
          rightDoorMesh.position.set(1.5, 0.8, 0.8);
          carGroup.add(leftDoorMesh);
          carGroup.add(rightDoorMesh);
        }

        const leftDoorMesh = carGroup.getObjectByName('leftDoor');
        const rightDoorMesh = carGroup.getObjectByName('rightDoor');

        if (doorOpen) {
          leftDoorMesh.rotation.y = 0.9;
          rightDoorMesh.rotation.y = -0.9;
        } else {
          leftDoorMesh.rotation.y = 0;
          rightDoorMesh.rotation.y = 0;
        }
      }

      const chatOutput = document.getElementById('chat-output');

      document.getElementById('cam-ext').addEventListener('click', () => setCamera('ext'));
      document.getElementById('cam-driver').addEventListener('click', () => setCamera('driver'));
      document.getElementById('cam-top').addEventListener('click', () => setCamera('top'));

      document.getElementById('btn-attack').addEventListener('click', () => {
        attackModeActive = !attackModeActive;
        bodyMaterial.color.setHex(attackModeActive ? 0xff0000 : 0x101010);
        bodyMaterial.emissive.setHex(attackModeActive ? 0x330000 : 0x050505);
        underGlow.material.color.setHex(attackModeActive ? 0xff0000 : 0x00ffcc);
        underGlow.material.emissive.setHex(attackModeActive ? 0xff0000 : 0x00ffcc);
        chatOutput.innerText = attackModeActive
          ? '"Mode Attaque visuel activé. Aérodynamique modifiée."'
          : '"Mode normal rétabli."';
      });

      document.getElementById('btn-doors').addEventListener('click', () => {
        doorOpen = !doorOpen;
        updateDoorAnimation();
        chatOutput.innerText = doorOpen
          ? '"Portes papillon ouvertes. Vérification des mécanismes."'
          : '"Portes sécurisées. Système verrouillé."';
      });

      document.getElementById('btn-diag').addEventListener('click', () => {
        const status = [
          'Systèmes primaires : OK',
          'Moteur : Stable',
          'Niveau de puissance : 100%',
          'Rapport de combat : 0.0'
        ].join(' • ');
        chatOutput.innerText = `"${status}"`;
      });

      const chatInput = document.getElementById('chat-input');
      chatInput.addEventListener('keypress', (event) => {
        if (event.key === 'Enter') {
          const inputVal = chatInput.value.trim();
          if (inputVal !== '') {
            chatOutput.innerText = `"${inputVal}" - Traitement par l'IA en cours...`;
            chatInput.value = '';
          }
        }
      });

      function animate() {
        requestAnimationFrame(animate);

        const t = performance.now() * 0.001;
        carGroup.rotation.y = Math.sin(t * 0.6) * 0.18;
        carGroup.position.y = Math.sin(t * 2.2) * 0.04;

        if (attackModeActive) {
          underGlow.scale.setScalar(1.08 + Math.sin(t * 12) * 0.08);
          frontLightLeft.material.emissiveIntensity = 2.2 + Math.sin(t * 15) * 1.0;
          frontLightRight.material.emissiveIntensity = 2.2 + Math.sin(t * 15 + 0.5) * 1.0;
        } else {
          underGlow.scale.setScalar(1.0);
          frontLightLeft.material.emissiveIntensity = 1.3;
          frontLightRight.material.emissiveIntensity = 1.3;
        }

        wheels.forEach((wheel, index) => {
          wheel.rotation.x += 0.03;
          if (index % 2 === 0) {
            wheel.rotation.y = Math.sin(t * 2.5) * 0.06;
          }
        });

        renderer.render(scene, camera);
      }

      setCamera('ext');
      updateDoorAnimation();
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    });
  </script>
</body>
</html>
